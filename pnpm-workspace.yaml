packages:
  - api
  - ui

# pnpm 11 reads overrides here; pnpm 9 uses the matching package.json field.
overrides:
  react: 18.3.1
  react-dom: 18.3.1
  "@sentry/node": 10.76.2
  "@opentelemetry/api": 1.9.1
  "@opentelemetry/instrumentation": 0.220.0
  "@opentelemetry/sdk-trace-base": 2.12.0

# Explicit install-script policy for pnpm 11; pnpm 9 retains its own behavior.
allowBuilds:
  "@apollo/protobufjs": true
  esbuild: true
  aws-sdk: false
  core-js-pure: false
  msgpackr-extract: false
